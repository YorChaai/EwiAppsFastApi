<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWIAPPS — Interactive Master Test Suite & QA Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-card-hover: rgba(31, 41, 55, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-active: rgba(99, 102, 241, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --glow-primary: rgba(99, 102, 241, 0.25);
      --glow-success: rgba(16, 185, 129, 0.2);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient Gradient Glows */
    .ambient-glow {
      position: fixed;
      top: -200px;
      left: 20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(11, 15, 25, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .ambient-glow-2 {
      position: fixed;
      bottom: -200px;
      right: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(11, 15, 25, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(11, 15, 25, 0.85);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
    }

    .header-container {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      color: white;
      box-shadow: 0 0 20px var(--glow-primary);
    }

    .brand-info h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-live {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-full);
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .brand-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Overall Progress Widget in Header */
    .header-progress {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius-lg);
    }

    .progress-stats {
      text-align: right;
    }

    .progress-stats-title {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .progress-stats-numbers {
      font-size: 1.1rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text-main);
    }

    .progress-bar-container {
      width: 140px;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-success));
      border-radius: var(--radius-full);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.55rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      border: none;
      font-family: var(--font-main);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover));
      color: white;
      box-shadow: 0 4px 12px var(--glow-primary);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px var(--glow-primary);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger-outline {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger-outline:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--accent-danger);
    }

    /* Main Container */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem;
      flex: 1;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* Controls & Filter Bar */
    .controls-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
      font-family: var(--font-main);
    }

    .search-box input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--glow-primary);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .filter-chips {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .chip:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .chip.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent-primary);
      color: #818cf8;
      font-weight: 600;
    }

    /* Layout Grid: Sidebar Navigation + Main Test Cards */
    .matrix-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* Sidebar Navigation */
    .module-nav {
      position: sticky;
      top: 90px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1rem;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      backdrop-filter: blur(12px);
    }

    .module-nav-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-dim);
      padding: 0.5rem 0.75rem 0.75rem;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 0.5rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 0.25rem;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .nav-item.active {
      background: rgba(99, 102, 241, 0.12);
      color: #818cf8;
      font-weight: 600;
      border-left: 3px solid var(--accent-primary);
    }

    .nav-item-count {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-item.complete .nav-item-count {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-success);
    }

    /* Content Area */
    .test-content {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .module-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s ease;
    }

    .module-section:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .module-header {
      padding: 1.25rem 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .module-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .module-badge-num {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .module-title-wrap h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .module-title-wrap p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .module-header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .module-progress-chip {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
    }

    .btn-batch-check {
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-batch-check:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    /* Test Cases List */
    .test-cases-list {
      padding: 0.75rem 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .test-item {
      display: grid;
      grid-template-columns: auto 110px 140px 1fr;
      align-items: center;
      gap: 1.25rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.2s ease;
    }

    .test-item:last-child {
      border-bottom: none;
    }

    .test-item:hover {
      background: rgba(255, 255, 255, 0.02);
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      border-radius: var(--radius-sm);
    }

    .test-item.completed {
      opacity: 0.65;
    }
    .test-item.completed .test-desc {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    /* Custom Checkbox */
    .checkbox-container {
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .custom-checkbox:hover {
      border-color: var(--accent-primary);
      box-shadow: 0 0 10px var(--glow-primary);
    }

    .custom-checkbox.checked {
      background: var(--accent-success);
      border-color: var(--accent-success);
      box-shadow: 0 0 12px var(--glow-success);
    }

    .custom-checkbox svg {
      width: 14px;
      height: 14px;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: none;
    }

    .custom-checkbox.checked svg {
      display: block;
    }

    .test-code {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(59, 130, 246, 0.25);
      text-align: center;
    }

    .test-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      text-align: center;
      white-space: nowrap;
    }

    .tag-normal {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .tag-edge {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .tag-security {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .tag-integration {
      background: rgba(139, 92, 246, 0.1);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.2);
    }
    .tag-ui {
      background: rgba(6, 182, 212, 0.1);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .test-desc {
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--text-main);
    }

    .test-desc strong {
      color: #e5e7eb;
    }

    /* Ripple Effect Matrix Table */
    .ripple-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.85rem;
    }

    .ripple-table th {
      text-align: left;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-color);
    }

    .ripple-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    .ripple-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg-secondary);
      border: 1px solid var(--accent-success);
      color: white;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Empty state */
    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-dim);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .matrix-layout {
        grid-template-columns: 1fr;
      }
      .module-nav {
        display: none;
      }
    }

    @media (max-width: 768px) {
      header {
        padding: 1rem;
      }
      .header-container {
        flex-direction: column;
        align-items: stretch;
      }
      .header-actions {
        justify-content: space-between;
      }
      .test-item {
        grid-template-columns: auto 1fr;
        gap: 0.75rem;
      }
      .test-code, .test-tag {
        grid-column: 2;
        justify-self: start;
      }
      .test-desc {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="brand-group">
        <div class="brand-logo">EW</div>
        <div class="brand-info">
          <h1>EWIAPPS QA Matrix <span class="badge-live">Live Test Suite</span></h1>
          <p>Financial & Expense Management Interactive Testing Environment</p>
        </div>
      </div>

      <!-- Header Progress Stats -->
      <div class="header-progress">
        <div class="progress-stats">
          <div class="progress-stats-title">Progress Uji Coba</div>
          <div class="progress-stats-numbers" id="totalProgressText">0 / 0 (0%)</div>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="totalProgressBar"></div>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-outline" id="btnExportMarkdown">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          Export Status
        </button>
        <button class="btn btn-danger-outline" id="btnResetAll">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          Reset All
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Controls Panel -->
    <div class="controls-panel">
      <div class="search-row">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Cari skenario test, kode (misal BM-001), keyword kalkulasi, nominal, atau error...">
        </div>
        <div class="filter-chips">
          <div class="chip active" data-filter="all">Semua Modul</div>
          <div class="chip" data-filter="untested">Belum Diuji</div>
          <div class="chip" data-filter="completed">Sudah Selesai (✓)</div>
          <div class="chip" data-filter="edge">Edge Cases & Limit</div>
          <div class="chip" data-filter="integration">Ripple Effects</div>
        </div>
      </div>
    </div>

    <!-- Matrix Layout -->
    <div class="matrix-layout">
      <!-- Sidebar Navigation -->
      <aside class="module-nav" id="sidebarNav">
        <div class="module-nav-title">Daftar Modul (19 Modul)</div>
        <div id="sidebarItems"></div>
      </aside>

      <!-- Test Cases Content -->
      <div class="test-content" id="modulesContainer"></div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toastNotification">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    <span id="toastMessage">State berhasil disimpan!</span>
  </div>

  <script>
    // Master Test Matrix Data

    // LocalStorage Keys
    const STORAGE_KEY = 'ewiapps_qa_matrix_state_v1';

    // State
    let checkedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    let currentFilter = 'all';
    let searchQuery = '';

    // Elements
    const modulesContainer = document.getElementById('modulesContainer');
    const sidebarItems = document.getElementById('sidebarItems');
    const totalProgressText = document.getElementById('totalProgressText');
    const totalProgressBar = document.getElementById('totalProgressBar');
    const searchInput = document.getElementById('searchInput');
    const toast = document.getElementById('toastNotification');
    const toastMessage = document.getElementById('toastMessage');

    // Show Toast Helper
    function showToast(msg) {
      toastMessage.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Save State
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedState));
      updateProgress();
    }

    // Calculate Progress
    function updateProgress() {
      let total = 0;
      let completed = 0;

      testMatrixData.forEach(mod => {
        let modTotal = mod.cases.length;
        let modCompleted = 0;
        mod.cases.forEach(c => {
          total++;
          if (checkedState[c.code]) {
            completed++;
            modCompleted++;
          }
        });

        // Update sidebar count
        const sideCount = document.getElementById(`nav-count-${mod.id}`);
        const sideItem = document.getElementById(`nav-item-${mod.id}`);
        if (sideCount && sideItem) {
          sideCount.textContent = `${modCompleted}/${modTotal}`;
          if (modCompleted === modTotal && modTotal > 0) {
            sideItem.classList.add('complete');
          } else {
            sideItem.classList.remove('complete');
          }
        }

        // Update module header chip
        const modChip = document.getElementById(`mod-progress-${mod.id}`);
        if (modChip) {
          const pct = Math.round((modCompleted / modTotal) * 100);
          modChip.textContent = `${modCompleted} / ${modTotal} (${pct}%)`;
          if (modCompleted === modTotal) {
            modChip.style.background = 'rgba(16, 185, 129, 0.15)';
            modChip.style.borderColor = 'rgba(16, 185, 129, 0.3)';
            modChip.style.color = '#34d399';
          } else {
            modChip.style.background = 'var(--bg-secondary)';
            modChip.style.borderColor = 'var(--border-color)';
            modChip.style.color = 'var(--text-muted)';
          }
        }
      });

      const totalPct = total > 0 ? Math.round((completed / total) * 100) : 0;
      totalProgressText.textContent = `${completed} / ${total} (${totalPct}%)`;
      totalProgressBar.style.width = `${totalPct}%`;
    }

    // Render Sidebar
    function renderSidebar() {
      sidebarItems.innerHTML = '';
      testMatrixData.forEach((mod, idx) => {
        const item = document.createElement('a');
        item.className = 'nav-item' + (idx === 0 ? ' active' : '');
        item.id = `nav-item-${mod.id}`;
        item.href = `#${mod.id}`;
        item.innerHTML = `
          <span>${mod.num}. ${mod.title}</span>
          <span class="nav-item-count" id="nav-count-${mod.id}">0/${mod.cases.length}</span>
        `;
        item.addEventListener('click', (e) => {
          document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
        });
        sidebarItems.appendChild(item);
      });
    }

    // Render Modules & Test Cases
    function renderMatrix() {
      modulesContainer.innerHTML = '';

      let anyVisible = false;

      testMatrixData.forEach(mod => {
        // Filter cases
        const filteredCases = mod.cases.filter(c => {
          const isChecked = !!checkedState[c.code];
          
          // Search filter
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchCode = c.code.toLowerCase().includes(q);
            const matchTag = c.tag.toLowerCase().includes(q);
            const matchDesc = c.desc.toLowerCase().includes(q);
            const matchMod = mod.title.toLowerCase().includes(q);
            if (!matchCode && !matchTag && !matchDesc && !matchMod) return false;
          }

          // Chip filter
          if (currentFilter === 'untested' && isChecked) return false;
          if (currentFilter === 'completed' && !isChecked) return false;
          if (currentFilter === 'edge' && c.type !== 'edge') return false;
          if (currentFilter === 'integration' && c.type !== 'integration') return false;

          return true;
        });

        if (filteredCases.length === 0) return;
        anyVisible = true;

        const section = document.createElement('div');
        section.className = 'module-section';
        section.id = mod.id;

        // Header
        const header = document.createElement('div');
        header.className = 'module-header';
        header.innerHTML = `
          <div class="module-header-left">
            <div class="module-badge-num">${mod.num}</div>
            <div class="module-title-wrap">
              <h2>${mod.title}</h2>
              <p>${mod.desc}</p>
            </div>
          </div>
          <div class="module-header-right">
            <span class="module-progress-chip" id="mod-progress-${mod.id}">0 / ${mod.cases.length}</span>
            <button class="btn-batch-check" onclick="toggleModuleAll('${mod.id}')">Toggle All</button>
          </div>
        `;
        section.appendChild(header);

        // List
        const list = document.createElement('div');
        list.className = 'test-cases-list';

        filteredCases.forEach(c => {
          const isChecked = !!checkedState[c.code];
          const item = document.createElement('div');
          item.className = `test-item ${isChecked ? 'completed' : ''}`;
          item.id = `item-${c.code}`;

          let tagClass = 'tag-normal';
          if (c.type === 'edge') tagClass = 'tag-edge';
          if (c.type === 'security') tagClass = 'tag-security';
          if (c.type === 'integration') tagClass = 'tag-integration';
          if (c.type === 'ui') tagClass = 'tag-ui';

          item.innerHTML = `
            <div class="checkbox-container" onclick="toggleTest('${c.code}')">
              <div class="custom-checkbox ${isChecked ? 'checked' : ''}" id="check-${c.code}">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
            </div>
            <div class="test-code">${c.code}</div>
            <div class="test-tag ${tagClass}">${c.tag}</div>
            <div class="test-desc">${c.desc}</div>
          `;
          list.appendChild(item);
        });

        section.appendChild(list);
        modulesContainer.appendChild(section);
      });

      if (!anyVisible) {
        modulesContainer.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom: 1rem; opacity: 0.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <h3>Tidak ada test case yang cocok</h3>
            <p style="margin-top: 0.5rem; font-size: 0.85rem">Coba ubah kata kunci pencarian atau ganti filter chip di atas.</p>
          </div>
        `;
      }

      updateProgress();
    }

    // Toggle Single Test Case
    window.toggleTest = function(code) {
      checkedState[code] = !checkedState[code];
      const checkEl = document.getElementById(`check-${code}`);
      const itemEl = document.getElementById(`item-${code}`);
      
      if (checkedState[code]) {
        if (checkEl) checkEl.classList.add('checked');
        if (itemEl) itemEl.classList.add('completed');
      } else {
        if (checkEl) checkEl.classList.remove('checked');
        if (itemEl) itemEl.classList.remove('completed');
      }

      saveState();
    };

    // Toggle All Cases in a Module
    window.toggleModuleAll = function(modId) {
      const mod = testMatrixData.find(m => m.id === modId);
      if (!mod) return;

      const allChecked = mod.cases.every(c => !!checkedState[c.code]);
      mod.cases.forEach(c => {
        checkedState[c.code] = !allChecked;
      });

      saveState();
      renderMatrix();
      showToast(allChecked ? `Semua tes di Modul ${mod.num} di-uncheck` : `Semua tes di Modul ${mod.num} selesai (✓)!`);
    };

    // Reset All State
    document.getElementById('btnResetAll').addEventListener('click', () => {
      if (confirm('Apakah Anda yakin ingin me-reset seluruh checklist pengujian kembali ke 0?')) {
        checkedState = {};
        saveState();
        renderMatrix();
        showToast('Seluruh progress pengujian berhasil di-reset!');
      }
    });

    // Export Markdown Status
    document.getElementById('btnExportMarkdown').addEventListener('click', () => {
      let md = `# LAPORAN HASIL PENGUJIAN EWIAPPS (QA REPORT)\n`;
      md += `> Tanggal Ekspor: ${new Date().toLocaleString('id-ID')}\n\n`;

      let total = 0;
      let completed = 0;

      testMatrixData.forEach(mod => {
        let modDone = mod.cases.filter(c => !!checkedState[c.code]).length;
        md += `## ${mod.num}. ${mod.title} (${modDone}/${mod.cases.length})\n`;
        mod.cases.forEach(c => {
          total++;
          const check = checkedState[c.code] ? '[x]' : '[ ]';
          if (checkedState[c.code]) completed++;
          const cleanDesc = c.desc.replace(/<[^>]*>?/gm, '');
          md += `- ${check} **${c.code}** | [${c.tag}] ${cleanDesc}\n`;
        });
        md += `\n`;
      });

      const pct = Math.round((completed / total) * 100);
      md = `# LAPORAN HASIL PENGUJIAN EWIAPPS (QA REPORT)\n> Total Selesai: ${completed} dari ${total} test case (${pct}%)\n` + md.substring(md.indexOf('\n\n'));

      const blob = new Blob([md], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ewiapps_qa_report_${new Date().toISOString().slice(0,10)}.md`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Laporan Markdown berhasil di-export & diunduh!');
    });

    // Search Input Event
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderMatrix();
    });

    // Filter Chips Event
    document.querySelectorAll('.filter-chips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.getAttribute('data-filter');
        renderMatrix();
      });
    });

    // Initial Execution
    renderSidebar();
    renderMatrix();
  </script>
